name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 准备签名
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -alias whalepet \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass whalepet123 -keypass whalepet123 -dname "CN=whale-pet"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore.jks
            git commit -m "chore: add signing keystore"
            git push
          fi
          unzip -oq whale-pet-android-current.zip -d src
          cp keystore.jks src/whale-pet-android/app/keystore.jks
      - run: gradle -p src/whale-pet-android -Pvc=${{ github.run_number }} assembleDebug --no-daemon
      - name: 发布到 dist 分支（CDN 用）
        run: |
          cp src/whale-pet-android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan dist-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 ! -name 'app-debug.apk' ! -name '.git' -exec rm -rf {} +
          git add app-debug.apk
          git commit -m "dist: build ${{ github.run_number }}"
          git push -f origin HEAD:dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: src/whale-pet-android/app/build/outputs/apk/debug/app-debug.apk
