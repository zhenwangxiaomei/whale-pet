name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: unzip -q whale-pet-android.zip -d src
      - run: gradle -p src/whale-pet-android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: whale-pet-apk
          path: src/whale-pet-android/app/build/outputs/apk/debug/*.apk
